<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ big_word }} Contact</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
</head>

<body>
    <div class="card">
        <a href="/" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Назад
        </a>

        <h1>{{ big_word }} контакт</h1>
        <p class="subtitle">Заполните данные ниже</p>

        <form method="post">
            {% if mode == 'add' %}
            <div class="form-group">
                <label for="name">Имя</label>
                <input type="text" id="name" name="name" placeholder="Введите имя" required autocomplete="off">
            </div>
            {% endif %}

            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" name="phone" value="{{ current_phone or '' }}"
                    placeholder="7-777-777-77-77" required>
            </div>

            <div class="form-group">
                <label for="company">Компания</label>
                <input type="text" id="company" name="company" value="{{ current_company or '' }}" placeholder="Введите копманию (необязательно)">
            </div>

            <select class="group-select" name="group_id">
                <option value="">Без группы</option>
                {% for group in groups %}
                <option value="{{ group.id }}" {% if contact and contact.group_id==group.id %}selected{% endif %}>
                    {{ group.name }}
                </option>
                {% endfor %}
            </select>

            {% if mode == 'add' %}
            <button type="submit" class="submit-btn">Добавить контакт</button>
            {% else %}
            <button type="submit" class="submit-btn">Изменить контакт</button>
            {% endif %}
        </form>
    </div>
</body>

</html>
